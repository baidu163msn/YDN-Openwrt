#CI项目
name: QCA-ALL

#CI计划
on:
  #定时编译：每周一 03:00 UTC（北京时间 11:00）
  schedule:
    - cron: "0 3 * * 1"
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#避免同一分支并发跑多个数小时的构建，新触发会取消旧运行
concurrency:
  group: qca-all-${{github.ref}}
  cancel-in-progress: true

#CI权限（最小权限：发布release需contents，缓存/旧release清理需actions）
permissions:
  contents: write
  actions: write

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: argon
      WRT_NAME: WH
      WRT_SSID: "OpenWrt"
      WRT_WORD: "12345678"
      WRT_IP: 192.168.68.1
      WRT_PW: password
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE || ''}}
      WRT_TEST: ${{inputs.TEST || false}}
